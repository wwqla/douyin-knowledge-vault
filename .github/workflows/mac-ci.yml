name: Mac CI
on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/mac-*.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac-*.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Unit tests (collection mapping, cookie export, launchd, state, vault)
        run: npm test

  worker:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Test bundled FavVault worker
        working-directory: mac/engine/worker
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'
          uv run pytest -q

  build:
    runs-on: macos-14
    needs: check
    defaults:
      run:
        working-directory: mac
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci || npm install
      - name: Build DMG (unsigned, ad-hoc)
        run: npm run dist
      - name: Verify app bundle
        run: |
          APP="release/mac-arm64/抖音知识库.app"
          npx --yes @electron/asar list "$APP/Contents/Resources/app.asar" > /tmp/asar.txt
          for f in /boot/bootstrap.js /main.js /preload.js /lib/douyin.js /lib/update-core.js /lib/updater.js /lib/fonts.js /renderer/mac.js /assets/card-icons/knowledge-book.png /engine/install-worker.sh /engine/worker/pyproject.toml /engine/worker/src/favvault_worker/cli.py; do grep -qx "$f" /tmp/asar.txt || { echo "missing $f"; grep "^/engine" /tmp/asar.txt | head; exit 1; }; done
          if grep -E "^/renderer/fonts|^/test/|^/engine/worker/tests|__pycache__" /tmp/asar.txt; then echo "unexpected files in asar"; exit 1; fi
          echo "Chromium locales: $(ls "$APP/Contents/Frameworks/Electron Framework.framework/Resources" | grep -c lproj)"
          codesign --verify --deep --strict "$APP" && echo "signature ok"
          ls -la release/*.dmg "$APP/Contents/Resources/app.asar"
      - name: Incremental update smoke test (bootstrap loads a newer app layer, falls back on corruption/crash)
        run: bash test/layer-smoke.sh "release/mac-arm64/抖音知识库.app"
      - name: Smoke test packaged app
        run: |
          "release/mac-arm64/抖音知识库.app/Contents/MacOS/抖音知识库" --smoke-test >/tmp/smoke.log 2>&1; rc=$?; grep SMOKE /tmp/smoke.log; exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: mac/release/*.dmg
          retention-days: 7

  engine-install:
    # 模拟应用内「一键安装」：在干净的 macOS 上跑内置的 install-worker.sh（SenseVoice + Whisper），自检，再真实转写一段中文
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install engine like the app does
        run: |
          export FAVVAULT_HOME="$RUNNER_TEMP/DouyinKnowledgeVault/engine"
          mkdir -p "$FAVVAULT_HOME/src"
          cp -R mac/engine/worker "$FAVVAULT_HOME/src/worker"
          rm -rf "$FAVVAULT_HOME/src/worker/tests"
          env -i HOME="$HOME" FAVVAULT_HOME="$FAVVAULT_HOME" PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            /bin/bash mac/engine/install-worker.sh "$FAVVAULT_HOME/src/worker" mlx,sensevoice | tee install.log
          grep -q '^DONE$' install.log
          "$FAVVAULT_HOME/venv/bin/python" -m favvault_worker doctor | tee doctor.json
          grep -q '"sensevoice": true' doctor.json
          grep -q '"mlx": true' doctor.json
          "$FAVVAULT_HOME/venv/bin/python" -m favvault_worker process --help | grep -- --cookies
          echo "FAVVAULT_HOME=$FAVVAULT_HOME" >> "$GITHUB_ENV"
      - name: Real SenseVoice transcription (say -v Tingting → aiff → worker)
        run: |
          set -euo pipefail
          PY="$FAVVAULT_HOME/venv/bin/python"
          export HF_HUB_CACHE="$RUNNER_TEMP/hf-cache"
          "$PY" -m favvault_worker download-model --engine sensevoice | tail -n 3
          # 第二次：模型已在共享缓存里，必须跳过下载
          "$PY" -m favvault_worker download-model --engine sensevoice > again.jsonl
          if grep -q model_download again.jsonl; then echo "model downloaded twice"; cat again.jsonl; exit 1; fi
          "$PY" -m favvault_worker models | tee models.json
          ls -la "$HF_HUB_CACHE"/models--csukuangfj--sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/snapshots/*/
          TEXT="今天天气很好，我们一起去公园散步吧。"
          VOICE="$(say -v '?' | grep -E 'zh_CN' | head -n1 | sed -E 's/ +zh_CN.*//' || true)"
          echo "voice: ${VOICE:-none}"
          if [ -n "$VOICE" ] && say -v "$VOICE" -o "$RUNNER_TEMP/zh.aiff" "$TEXT"; then SAMPLE="$RUNNER_TEMP/zh.aiff"; EXPECT=1
          else
            curl -fsSL -o "$RUNNER_TEMP/zh.wav" https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/test_wavs/zh.wav
            SAMPLE="$RUNNER_TEMP/zh.wav"; EXPECT=0
          fi
          time "$PY" -m favvault_worker transcribe "$SAMPLE" --asr sensevoice | tee tr.jsonl
          python3 - "$EXPECT" <<'PY'
          import json, re, sys
          ev = [json.loads(l) for l in open("tr.jsonl") if l.strip().startswith("{")]
          tr = [e for e in ev if e["event"] == "transcript"]
          assert tr, ev[-3:]
          text = tr[0]["text"]
          print("SENSEVOICE TRANSCRIPT:", text)
          cjk = re.findall(r"[\u4e00-\u9fff]", text)
          assert len(cjk) >= 4, "expected Chinese output"
          if sys.argv[1] == "1":
              hits = sum(w in text for w in ("今天", "天气", "公园", "散步"))
              assert hits >= 2, f"transcript too far from the spoken text ({hits}/4 keywords)"
          PY
