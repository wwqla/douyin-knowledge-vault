name: Mac CI
on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/mac-*.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac-*.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Unit tests (collection mapping, cookie export, launchd, state, vault)
        run: npm test

  worker:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Test bundled FavVault worker
        working-directory: mac/engine/worker
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'
          uv run pytest -q

  build:
    runs-on: macos-14
    needs: check
    defaults:
      run:
        working-directory: mac
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci || npm install
      - name: Build DMG (unsigned, ad-hoc)
        run: npm run dist
      - name: Verify app bundle
        run: |
          APP="release/mac-arm64/抖音知识库.app"
          test -f "$APP/Contents/Resources/engine/install-worker.sh"
          test -f "$APP/Contents/Resources/engine/worker/pyproject.toml"
          test -f "$APP/Contents/Resources/engine/worker/src/favvault_worker/cli.py"
          test ! -e "$APP/Contents/Resources/engine/worker/tests"
          npx --yes @electron/asar list "$APP/Contents/Resources/app.asar" | grep -E "^/(main.js|preload.js|lib/douyin.js|renderer/mac.js|assets/card-icons/knowledge-book.png)$"
          codesign --verify --deep --strict "$APP" && echo "signature ok"
          ls -la release/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: mac/release/*.dmg
          retention-days: 7
