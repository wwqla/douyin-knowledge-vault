name: Mac CI
on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/mac-*.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac-*.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Unit tests (collection mapping, cookie export, launchd, state, vault)
        run: npm test

  worker:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Test bundled FavVault worker
        working-directory: mac/engine/worker
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'
          uv run pytest -q

  build:
    runs-on: macos-14
    needs: check
    defaults:
      run:
        working-directory: mac
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci || npm install
      - name: Build DMG (unsigned, ad-hoc)
        run: npm run dist
      - name: Verify app bundle
        run: |
          APP="release/mac-arm64/抖音知识库.app"
          test -f "$APP/Contents/Resources/engine/install-worker.sh"
          test -f "$APP/Contents/Resources/engine/worker/pyproject.toml"
          test -f "$APP/Contents/Resources/engine/worker/src/favvault_worker/cli.py"
          test ! -e "$APP/Contents/Resources/engine/worker/tests"
          npx --yes @electron/asar list "$APP/Contents/Resources/app.asar" > /tmp/asar.txt
          for f in /boot/bootstrap.js /main.js /preload.js /lib/douyin.js /lib/update-core.js /lib/updater.js /lib/fonts.js /renderer/mac.js /assets/card-icons/knowledge-book.png /engine/install-worker.sh; do grep -qx "$f" /tmp/asar.txt || { echo "missing $f"; exit 1; }; done
          if grep -E "^/renderer/fonts|^/test/|^/engine/worker/tests|__pycache__" /tmp/asar.txt; then echo "unexpected files in asar"; exit 1; fi
          echo "Chromium locales: $(ls "$APP/Contents/Frameworks/Electron Framework.framework/Resources" | grep -c lproj)"
          codesign --verify --deep --strict "$APP" && echo "signature ok"
          ls -la release/*.dmg "$APP/Contents/Resources/app.asar"
      - name: Incremental update smoke test (bootstrap loads a newer app layer, falls back on corruption/crash)
        run: bash test/layer-smoke.sh "release/mac-arm64/抖音知识库.app"
      - name: Smoke test packaged app
        run: |
          "release/mac-arm64/抖音知识库.app/Contents/MacOS/抖音知识库" --smoke-test >/tmp/smoke.log 2>&1; rc=$?; grep SMOKE /tmp/smoke.log; exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: mac/release/*.dmg
          retention-days: 7

  engine-install:
    # 模拟应用内「一键安装」：在干净的 macOS 上跑内置的 install-worker.sh（mlx 版），再自检
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install engine like the app does
        run: |
          export FAVVAULT_HOME="$RUNNER_TEMP/DouyinKnowledgeVault/engine"
          mkdir -p "$FAVVAULT_HOME/src"
          cp -R mac/engine/worker "$FAVVAULT_HOME/src/worker"
          rm -rf "$FAVVAULT_HOME/src/worker/tests"
          env -i HOME="$HOME" FAVVAULT_HOME="$FAVVAULT_HOME" PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            /bin/bash mac/engine/install-worker.sh "$FAVVAULT_HOME/src/worker" mlx | tee install.log
          grep -q '^DONE$' install.log
          "$FAVVAULT_HOME/venv/bin/python" -m favvault_worker doctor
          "$FAVVAULT_HOME/venv/bin/python" -m favvault_worker process --help | grep -- --cookies
