[project]
name = "favvault-worker"
version = "0.2.0"
description = "FavVault pipeline worker: favorites -> transcript -> LLM notes -> Obsidian Markdown"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp>=2025.1.1",
  "httpx>=0.27",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Apple Silicon: fast, accurate local Whisper
mlx = ["mlx-whisper>=0.4", "huggingface_hub>=0.23"]
# SenseVoiceSmall via sherpa-onnx (CPU, no PyTorch, ~230 MB int8 model): best for Chinese
sensevoice = ["sherpa-onnx>=1.12", "huggingface_hub>=0.23", "numpy>=1.24"]
# Intel Macs / fallback
cpu = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "numpy>=1.24"]

[project.scripts]
favvault-worker = "favvault_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/favvault_worker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
